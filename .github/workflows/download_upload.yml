name: Hydrax Video Worker

on:
  repository_dispatch:
    types: [trigger-download-upload]

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Download and Upload with Speed Info
      env:
        HYDRAX_API_KEY: ${{ secrets.HYDRAX_API_KEY }}
        DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
        VPS_CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      run: |
        RANDOM_NAME=$(date +%s%N | md5sum | head -c 8).mp4
        
        echo "=== BẮT ĐẦU TẢI VIDEO TỪ LINK ĐẦU VÀO ==="
        curl -L "$DOWNLOAD_URL" -o "$RANDOM_NAME" 2>&1 | tr '\r' '\n'

        echo "=== BẮT ĐẦU UPLOAD LÊN HYDRAX ==="
        RESPONSE=$(curl -X POST -F "file=@$RANDOM_NAME" "https://up.abyss.to/$HYDRAX_API_KEY" 2>&1 | tr '\r' '\n')
        
        HYDRAX_TAG=$(echo "$RESPONSE" | grep -o '"slug":"[^"]*' | grep -o '[^"]*$')
        
        if [ ! -z "$HYDRAX_TAG" ]; then
          echo "Upload video mới thành công lên Hydrax: $HYDRAX_TAG"
          curl -s -X POST -H "Content-Type: application/json" -d "{\"hydrax_tag\":\"$HYDRAX_TAG\"}" "$VPS_CALLBACK_URL"
        else
          echo "Lỗi Upload. Phản hồi từ Hydrax: $RESPONSE"
          exit 1
        fi
